@if (state.isOpen) {
  <div
    class="fixed inset-0 z-60 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm transition-opacity"
    (click)="onBackdropClick($event)"
  >
    <div
      class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 transform transition-all scale-100 animate-fade-in mx-4"
      role="dialog"
      aria-modal="true"
    >
      <div class="flex items-center gap-4 mb-4">
        <div class="shrink-0 w-10 h-10 rounded-full bg-red-100 flex items-center justify-center">
          <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
        <h3 class="text-lg font-bold text-slate-900">
          {{ state.title }}
        </h3>
      </div>

      <p class="text-slate-600 mb-8 ml-14 -mt-2">
        {{ state.message }}
      </p>

      <div class="flex justify-end gap-3">
        <button
          (click)="confirmService.cancel()"
          class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 focus:ring-2 focus:ring-slate-200 transition-colors"
        >
          {{ state.cancelText }}
        </button>

        <button
          (click)="confirmService.confirm()"
          class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-colors shadow-sm"
        >
          {{ state.confirmText }}
        </button>
      </div>
    </div>
  </div>
}
